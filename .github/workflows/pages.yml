name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to commit images optimized by the build (e.g. a photo uploaded from /admin)
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Progressive, recompressed images. New ones (uploaded from /admin) are fixed and committed here,
      # because the CDN below serves files straight from the repository.
      - name: Optimize images
        run: |
          node scripts/optimize-images.mjs
          if [ -n "$(git status --porcelain assets)" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add assets
              git commit -m "Optimize images [skip ci]"
              git push
            else
              echo "::error::Some images are not optimized: run 'npm run optimize' and commit the result"
              git status --porcelain assets
              exit 1
            fi
          fi

      - name: Test
        run: npm test

      # Static files from jsDelivr pinned to this commit: cached for a year instead of GitHub Pages' 10 minutes.
      # If jsDelivr cannot serve the commit, the site is built with its own copies as before.
      - name: Build
        run: |
          CDN="https://cdn.jsdelivr.net/gh/${{ github.repository }}@$(git rev-parse HEAD)/"
          if curl -fsS --retry 4 --retry-delay 5 -o /dev/null "${CDN}style.css" && curl -fsS --retry 2 -o /dev/null "${CDN}main.js"; then
            ASSET_CDN="$CDN" node scripts/build.mjs
          else
            echo "::warning::jsDelivr could not serve this commit, building with local assets"
            node scripts/build.mjs
          fi

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Scores the live site like WebPageTest (cache static content, compress images, progressive JPEG)
  audit:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit the deployed site
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          sleep 20
          node scripts/perf-audit.mjs "${{ needs.deploy.outputs.page_url }}" --min 90 --json audit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-audit
          path: audit.json
          if-no-files-found: ignore
